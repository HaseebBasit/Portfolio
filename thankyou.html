<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Haseeb Basit</title>

    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(63, 169, 245, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(123, 97, 255, 0.18),
                    transparent 35%
                ),
                #0d122b;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            overflow: hidden;

            color: #ffffff;
        }


        /* =========================================================
           BACKGROUND GLOW
        ========================================================= */

        body::before {
            content: "";

            position: fixed;

            width: 420px;
            height: 420px;

            top: -180px;
            left: -150px;

            background: rgba(63, 169, 245, 0.12);

            border-radius: 50%;

            filter: blur(20px);

            pointer-events: none;
        }


        body::after {
            content: "";

            position: fixed;

            width: 380px;
            height: 380px;

            bottom: -170px;
            right: -130px;

            background: rgba(123, 97, 255, 0.12);

            border-radius: 50%;

            filter: blur(20px);

            pointer-events: none;
        }


        /* =========================================================
           MAIN CARD
        ========================================================= */

        .thank-you-container {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 680px;

            text-align: center;

            padding: 65px 50px;

            background: rgba(21, 28, 64, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 24px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            animation: fadeUp 0.8s ease forwards;
        }


        /* =========================================================
           SUCCESS ICON
        ========================================================= */

        .success-icon {

            width: 95px;
            height: 95px;

            margin: 0 auto 30px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #3fa9f5,
                    #7b61ff
                );

            color: #ffffff;

            font-size: 48px;
            font-weight: bold;

            box-shadow:
                0 15px 40px rgba(63, 169, 245, 0.30);

            animation:
                pop 0.7s ease 0.3s both,
                glow 2.5s ease-in-out infinite 1s;
        }


        /* =========================================================
           HEADING
        ========================================================= */

        h1 {

            font-size: 48px;

            line-height: 1.2;

            color: #ffffff;

            margin-bottom: 18px;

            font-weight: 700;

            letter-spacing: -0.5px;
        }


        h1 span {

            background:
                linear-gradient(
                    135deg,
                    #3fa9f5,
                    #7b61ff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-clip: text;
        }


        /* =========================================================
           MAIN MESSAGE
        ========================================================= */

        .message {

            max-width: 520px;

            margin: 0 auto 25px;

            font-size: 17px;

            line-height: 1.8;

            color: rgba(255, 255, 255, 0.68);
        }


        /* =========================================================
           SMALL MESSAGE
        ========================================================= */

        .small-message {

            font-size: 14px;

            line-height: 1.6;

            color: rgba(255, 255, 255, 0.40);

            margin-bottom: 35px;
        }


        /* =========================================================
           BUTTON
        ========================================================= */

        .home-btn {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 52px;

            padding: 0 30px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #3fa9f5,
                    #7b61ff
                );

            color: #ffffff;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 0.4px;

            box-shadow:
                0 10px 30px rgba(63, 169, 245, 0.25);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }


        .home-btn:hover {

            color: #ffffff;

            transform: translateY(-4px);

            box-shadow:
                0 15px 35px rgba(63, 169, 245, 0.40);

            background:
                linear-gradient(
                    135deg,
                    #4da6c8,
                    #8b73ff
                );
        }


        .home-btn:active {

            transform: translateY(-1px);
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        .footer-text {

            margin-top: 40px;

            font-size: 13px;

            color: rgba(255, 255, 255, 0.32);

            letter-spacing: 0.2px;
        }


        .footer-text strong {

            color: rgba(255, 255, 255, 0.65);

            font-weight: 600;
        }


        /* =========================================================
           ANIMATIONS
        ========================================================= */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes pop {

            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            70% {
                transform: scale(1.08);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }


        @keyframes glow {

            0%,
            100% {
                box-shadow:
                    0 15px 40px rgba(63, 169, 245, 0.30);
            }

            50% {
                box-shadow:
                    0 15px 50px rgba(123, 97, 255, 0.45);
            }
        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 768px) {

            body {
                padding: 25px 18px;
            }

            .thank-you-container {

                max-width: 600px;

                padding: 55px 35px;

                border-radius: 22px;
            }

            .success-icon {

                width: 85px;
                height: 85px;

                font-size: 42px;

                margin-bottom: 25px;
            }

            h1 {
                font-size: 40px;
            }

            .message {
                font-size: 16px;
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            body {

                padding: 20px 15px;

                overflow-y: auto;
            }

            .thank-you-container {

                width: 100%;

                padding: 45px 23px;

                border-radius: 20px;
            }

            .success-icon {

                width: 78px;
                height: 78px;

                font-size: 38px;

                margin-bottom: 23px;
            }

            h1 {

                font-size: 34px;

                margin-bottom: 15px;
            }

            .message {

                font-size: 15px;

                line-height: 1.8;

                margin-bottom: 22px;
            }

            .small-message {

                font-size: 13px;

                margin-bottom: 30px;
            }

            .home-btn {

                width: 100%;

                min-height: 50px;

                padding: 0 20px;

                font-size: 13px;
            }

            .footer-text {

                margin-top: 32px;

                font-size: 12px;

                line-height: 1.6;
            }
        }


        /* =========================================================
           SMALL MOBILE
        ========================================================= */

        @media (max-width: 380px) {

            body {
                padding: 15px 12px;
            }

            .thank-you-container {

                padding: 38px 18px;

                border-radius: 18px;
            }

            .success-icon {

                width: 70px;
                height: 70px;

                font-size: 34px;
            }

            h1 {
                font-size: 30px;
            }

            .message {
                font-size: 14px;
            }

            .small-message {
                font-size: 12px;
            }

            .home-btn {
                font-size: 12px;
            }
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================================
         THANK YOU CARD
    ========================================================= -->

    <div class="thank-you-container">


        <!-- SUCCESS ICON -->

        <div class="success-icon">
            ✓
        </div>


        <!-- HEADING -->

        <h1>
            Thank <span>You!</span>
        </h1>


        <!-- MESSAGE -->

        <p class="message">

            Your message has been successfully sent.
            Thank you for reaching out. I really appreciate
            your time and interest.

        </p>


        <!-- SMALL MESSAGE -->

        <p class="small-message">

            I'll get back to you as soon as possible.

        </p>


        <!-- BACK BUTTON -->

        <a
            href="index.html"
            class="home-btn"
        >
            ←&nbsp; Back to Portfolio
        </a>


        <!-- FOOTER -->

        <div class="footer-text">

            Designed &amp; Developed by
            <strong>Haseeb Basit</strong>

        </div>


    </div>


</body>

</html>
